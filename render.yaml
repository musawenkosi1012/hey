services:
  - type: web
    name: chronisense
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///chronisense.db
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
